<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
	@font-face { font-family: 'Unbounded'; src: url('../../node_modules/@fontsource-variable/unbounded/files/unbounded-latin-wght-normal.woff2') format('woff2'); font-weight: 200 900; }
	@font-face { font-family: 'Unbounded'; src: url('../../node_modules/@fontsource-variable/unbounded/files/unbounded-latin-ext-wght-normal.woff2') format('woff2'); font-weight: 200 900; unicode-range: U+0100-024F, U+1E00-1EFF; }
	@font-face { font-family: 'Inter'; src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
	@font-face { font-family: 'Inter'; src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-ext-wght-normal.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0100-024F, U+1E00-1EFF; }
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 1080px; height: 1920px; overflow: hidden; background: #F6E36B; }
	#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; color: #141414; }
	.abs { position: absolute; }
	.display { font-family: 'Unbounded', sans-serif; font-weight: 800; letter-spacing: -0.01em; line-height: 1.02; }
	.hl { background: var(--hl, #fff); color: #141414; border-radius: 14px; padding: 0 12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
	.word { display: inline-block; white-space: pre; }
	.pill { display: inline-flex; align-items: center; gap: 18px; border-radius: 999px; padding: 22px 36px; font: 700 34px 'Inter'; }
	.card { border-radius: 56px; }
	.smiley { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* GoodPush video templates. Deterministic: draw(t) sets every style from the time t (seconds),
   so each frame is exact and the same every render. Safe zones: nothing important in the
   bottom 420 px or the right 170 px (TikTok / Reels buttons). */
const STICKER = { orange: '#FF5B1F', yellow: '#FFB81C', green: '#2F7D4A', mint: '#9FDBBE', pink: '#F7A6C9', purple: '#6C4DA6', cream: '#EEE7D2', sun: '#F6E36B', ink: '#141414' };
const CAT = { discipline: 'orange', calm: 'purple', sport: 'green', study: 'yellow', build: 'mint', faith: 'cream', selflove: 'pink' };
const DARK = ['orange', 'green', 'purple'];
const T = {
	now: { en: 'now', es: 'ahora', fr: 'maintenant' },
	bio: { en: 'goodpush · link in bio', es: 'goodpush · link en la bio', fr: 'goodpush · lien en bio' },
	free: { en: '14 days free', es: '14 días gratis', fr: '14 jours gratuits' },
	day: { en: 'Day', es: 'Día', fr: 'Jour' },
	ask: { en: 'Comment your number 👇', es: 'Comenta tu número 👇', fr: 'Commente ton numéro 👇' },
	streak: { en: 'day streak', es: 'días seguidos', fr: 'jours d’affilée' },
	theme: {
		discipline: { en: 'Discipline', es: 'Disciplina', fr: 'Discipline' }, study: { en: 'Study', es: 'Estudios', fr: 'Études' },
		calm: { en: 'Calm', es: 'Calma', fr: 'Calme' }, sport: { en: 'Sport', es: 'Deporte', fr: 'Sport' },
		build: { en: 'Build', es: 'Emprender', fr: 'Entreprendre' }, selflove: { en: 'Self-love', es: 'Amor propio', fr: 'Amour de soi' },
		faith: { en: 'Faith', es: 'Fe', fr: 'Foi' }
	},
	weekday: { en: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], es: ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'], fr: ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'] },
	month: { en: ['January','February','March','April','May','June','July','August','September','October','November','December'], es: ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'], fr: ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'] }
};

function smiley(mood = 'smile', color = 'yellow') {
	const bg = STICKER[color] ?? color; const line = bg === STICKER.ink ? STICKER.cream : STICKER.ink;
	const eyes = mood === 'wink'
		? `<rect x="38" y="35" width="7.5" height="18" rx="3.75" fill="${line}"/><path d="M55 45.5h9" stroke="${line}" stroke-width="7" stroke-linecap="round"/>`
		: mood === 'calm'
			? `<path d="M36.5 45c2.4-3.4 7.6-3.4 10 0M53.5 45c2.4-3.4 7.6-3.4 10 0" fill="none" stroke="${line}" stroke-width="5.5" stroke-linecap="round"/>`
			: `<rect x="38" y="35" width="7.5" height="18" rx="3.75" fill="${line}"/><rect x="54.5" y="35" width="7.5" height="18" rx="3.75" fill="${line}"/>`;
	return `<svg class="smiley" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="${bg}"/><circle cx="50" cy="50" r="33" fill="none" stroke="${line}" stroke-width="7"/>${eyes}<path d="M33 57.5c3.6 9.4 9.8 13.8 17 13.8s13.4-4.4 17-13.8" fill="none" stroke="${line}" stroke-width="7" stroke-linecap="round"/><path d="M29.5 41.5h4.5M29 49.5h3.5" stroke="${line}" stroke-width="3" stroke-linecap="round"/></svg>`;
}

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const backOut = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const plain = (s) => s.replace(/\*/g, '');
/** Phrase → word spans; the *starred* part gets the highlighter. */
function words(text) {
	const out = [];
	// punctuation right after the highlight stays on the same line as it
	text.replace(/\*([^*]+)\*([.,!?…:;]+)/g, '*$1$2*').split(/(\*[^*]+\*)/g).filter(Boolean).forEach((part) => {
		const hl = part.startsWith('*');
		const clean = hl ? part.slice(1, -1) : part;
		const ws = clean.split(/(\s+)/).filter((w) => w.length);
		const span = (w) => (/^\s+$/.test(w) ? ' ' : `<span class="word">${esc(w)}</span>`);
		if (hl) out.push(`<span class="hl">${ws.map(span).join('')}</span>`);
		else ws.forEach((w) => out.push(span(w)));
	});
	return out.join('');
}
/** Reveal words one by one between t0 and t1 (slide up + fade). */
function revealWords(root, t, t0, t1) {
	const ws = root.querySelectorAll('.word');
	const step = (t1 - t0) / Math.max(1, ws.length);
	ws.forEach((w, i) => {
		const p = easeExpo(prog(t, t0 + i * step, t0 + i * step + 0.45));
		w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 60}px)`;
	});
	root.querySelectorAll('.hl').forEach((h) => {
		const first = h.querySelector('.word'); h.style.opacity = first ? first.style.opacity : 1;
	});
}
function fitText(el, max, min = 40) {
	let s = max; el.style.fontSize = s + 'px';
	while (s > min && (el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2)) { s -= 4; el.style.fontSize = s + 'px'; }
}

// ---------- scenes ----------
let SCENE = null;
window.setup = function (job) {
	const stage = document.getElementById('stage');
	const { format, lang, theme } = job;
	const color = CAT[theme]; const bg = STICKER[color]; const dark = DARK.includes(color);
	const fg = dark ? '#FBF8F1' : '#141414';
	const hlColor = dark ? STICKER.sun : '#FFFFFF';
	const ph = job.phrases.map((p) => p[lang]);
	const end = `<div id="end" class="abs pill" style="left:80px; top:1380px; background:#141414; color:#FBF8F1; opacity:0">
		<span style="width:56px;height:56px;display:inline-block">${smiley('smile', 'sun')}</span>${T.bio[lang]} · ${T.free[lang]}</div>`;
	const d = new Date(job.date + 'T12:00:00');
	const dateLine = `${T.weekday[lang][d.getDay()]} ${d.getDate()} ${T.month[lang][d.getMonth()]}`;
	document.body.style.background = bg;

	if (format === 'A' || format === 'F') {
		const isF = format === 'F';
		const title = isF ? `🔥 ${job.streak} ${T.streak[lang]}` : T.theme[theme][lang];
		stage.innerHTML = `
			<div id="lock" class="abs" style="inset:0; background:#F6E36B">
				<div class="abs" style="left:0;right:0;top:250px;text-align:center;font:600 40px Inter;opacity:.7">${dateLine}</div>
				<div class="abs display" style="left:0;right:0;top:300px;text-align:center;font-size:230px;font-weight:600">${isF ? '07:30' : '08:00'}</div>
				${[['orange', 120, 1280, 240, -12, 'wink'], ['pink', 700, 1180, 200, 14, 'smile'], ['purple', 380, 1500, 170, 6, 'calm']].map(([c, x, y, s, r, m], k) => `<div class="abs float" data-k="${k}" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;transform:rotate(${r}deg)">${smiley(m, c)}</div>`).join('')}
			</div>
			<div id="notif" class="abs card" style="left:60px;width:960px;top:640px;background:rgba(255,255,255,.92);padding:40px 44px;box-shadow:0 30px 60px rgba(0,0,0,.18)">
				<div style="display:flex;align-items:center;gap:22px;font:600 32px Inter;opacity:.6"><span style="width:58px;height:58px;display:inline-block">${smiley('smile', 'ink')}</span>GOODPUSH<span style="margin-left:auto">${T.now[lang]}</span></div>
				<div style="font:800 44px Inter;margin-top:22px">${esc(title)}</div>
				<div style="font:500 42px/1.3 Inter;margin-top:8px">${esc(plain(ph[0]))}</div>
			</div>
			<div id="full" class="abs" style="inset:0;background:${bg};color:${fg};--hl:${hlColor};opacity:0">
				<div class="abs" style="left:80px;top:230px;font:700 36px Inter;letter-spacing:.12em;text-transform:uppercase;opacity:.75">${esc(title)}</div>
				<div id="big" class="abs display" style="left:80px;right:170px;top:330px;height:960px;display:flex;align-items:center"><div>${words(ph[0])}</div></div>
				<div class="abs" style="right:190px;top:1140px;width:220px;height:220px">${smiley('wink', dark ? 'cream' : 'ink')}</div>
			</div>${end}`;
		fitText(document.getElementById('big'), 120, 64);
		SCENE = { duration: 8, draw(t) {
			const n = document.getElementById('notif');
			const pIn = backOut(prog(t, 0.6, 1.3));
			n.style.transform = `translateY(${(1 - pIn) * -900}px) scale(${0.96 + 0.04 * pIn})`;
			const pOut = easeOut(prog(t, 2.8, 3.4));
			n.style.opacity = 1 - pOut;
			n.style.transform += ` scale(${1 + pOut * 0.25})`;
			document.getElementById('full').style.opacity = pOut;
			document.querySelectorAll('.float').forEach((f) => { const k = +f.dataset.k; f.style.marginTop = Math.sin(t * 1.6 + k * 2) * 18 + 'px'; });
			revealWords(document.getElementById('big'), t, 3.3, 4.6);
			document.getElementById('end').style.opacity = easeOut(prog(t, 5.6, 6.1));
		} };
	} else if (format === 'B') {
		const cardBg = ['#FFFFFF', STICKER.pink, STICKER.mint];
		stage.innerHTML = `
			<div class="abs" style="inset:0;background:${bg}"></div>
			<div id="hook" class="abs display" style="left:80px;right:170px;top:200px;font-size:76px;color:${fg}">${esc(job.hook[lang])}</div>
			${ph.map((p, i) => `<div class="abs card opt" style="left:80px;right:170px;top:${560 + i * 300}px;height:260px;background:${cardBg[i]};display:flex;align-items:center;gap:34px;padding:0 44px;box-shadow:0 18px 0 #141414">
				<div class="display" style="font-size:110px;width:90px">${i + 1}</div><div class="txt" style="font:700 44px/1.2 Inter;height:200px;flex:1;display:flex;align-items:center">${esc(plain(p))}</div></div>`).join('')}
			<div id="ask" class="abs pill" style="left:80px;top:1500px;background:#141414;color:#FBF8F1;opacity:0">${T.ask[lang]}</div>`;
		document.querySelectorAll('.opt .txt').forEach((e) => fitText(e, 46, 30));
		SCENE = { duration: 9, draw(t) {
			const h = document.getElementById('hook'); const ph0 = easeExpo(prog(t, 0.1, 0.8));
			h.style.opacity = ph0; h.style.transform = `translateY(${(1 - ph0) * 40}px)`;
			document.querySelectorAll('.opt').forEach((o, i) => { const p = backOut(prog(t, 1.0 + i * 1.5, 1.6 + i * 1.5)); o.style.opacity = clamp(p * 3); o.style.transform = `scale(${0.6 + 0.4 * p}) rotate(${(1 - clamp(p)) * (i % 2 ? 6 : -6)}deg)`; });
			const pa = easeOut(prog(t, 5.8, 6.3)); const a = document.getElementById('ask'); a.style.opacity = pa; a.style.transform = `translateY(${(1 - pa) * 30}px)`;
		} };
	} else if (format === 'R') { // R — "cine": real footage underneath (ffmpeg), letterbox + subtitle, no branding until the very end
		document.documentElement.style.background = document.body.style.background = 'transparent';
		const sub = esc(ph[0]).replace(/\*([^*]+)\*/g, '<span style="color:#F6E36B">$1</span>');
		stage.innerHTML = `
			<div class="abs" style="inset:0;background:radial-gradient(120% 80% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)"></div>
			<div class="abs" style="left:0;right:0;top:0;height:250px;background:#000"></div>
			<div class="abs" style="left:0;right:0;bottom:0;height:250px;background:#000"></div>
			<div id="hook" class="abs" style="left:70px;right:70px;top:150px;font:600 38px/1.2 Inter;color:rgba(255,255,255,.92);text-align:center;letter-spacing:.01em">${esc(job.hook[lang]).toLowerCase()}</div>
			<div id="sub" class="abs" style="left:110px;right:110px;top:1180px;height:380px;display:flex;align-items:center;justify-content:center;text-align:center;font:600 60px/1.28 Inter;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.9),0 0 24px rgba(0,0,0,.6)"><div>${sub}</div></div>
			<div id="mark" class="abs" style="right:70px;bottom:95px;display:flex;align-items:center;gap:14px;font:700 30px Inter;color:rgba(255,255,255,.85);opacity:0"><span style="width:40px;height:40px;display:inline-block">${smiley('smile', 'sun')}</span>goodpush</div>`;
		fitText(document.getElementById('sub'), 64, 40);
		SCENE = { duration: 8, draw(t) {
			const h = document.getElementById('hook'); h.style.opacity = easeOut(prog(t, 0.2, 0.9));
			const s2 = document.getElementById('sub'); const ps = easeOut(prog(t, 1.2, 2.0)); s2.style.opacity = ps; s2.style.transform = `translateY(${(1 - ps) * 14}px)`;
			document.getElementById('mark').style.opacity = easeOut(prog(t, 5.6, 6.2));
		} };
	} else { // D — phrase on color + floating stickers
		stage.innerHTML = `
			<div class="abs" style="inset:0;background:${bg};color:${fg};--hl:${hlColor}">
				${[['sun', 760, 230, 210, 10, 'wink'], ['cream', 90, 1200, 170, -14, 'smile'], ['pink', 620, 1250, 140, 8, 'calm']].map(([c, x, y, s, r, m], k) => `<div class="abs float" data-k="${k}" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;transform:rotate(${r}deg)">${smiley(m, c)}</div>`).join('')}
				<div class="abs" style="left:80px;top:260px;font:700 34px Inter;letter-spacing:.12em;text-transform:uppercase;opacity:.75">${esc(job.hook[lang])}</div>
				<div id="big" class="abs display" style="left:80px;right:170px;top:420px;height:760px;display:flex;align-items:center"><div>${words(ph[0])}</div></div>
			</div>${end.replace('opacity:0', 'opacity:0;background:#FBF8F1;color:#141414')}`;
		fitText(document.getElementById('big'), 128, 64);
		SCENE = { duration: 7, draw(t) {
			document.querySelectorAll('.float').forEach((f) => { const k = +f.dataset.k; f.style.marginTop = Math.sin(t * 1.4 + k * 2.1) * 22 + 'px'; f.style.marginLeft = Math.cos(t * 1.1 + k) * 10 + 'px'; });
			revealWords(document.getElementById('big'), t, 0.4, 2.2);
			document.getElementById('end').style.opacity = easeOut(prog(t, 4.6, 5.1));
		} };
	}
	return document.fonts.ready.then(() => { // re-fit once the fonts are in
		const big = document.getElementById('big'); if (big) fitText(big, format === 'D' ? 128 : 120, 64);
		const sub = document.getElementById('sub'); if (sub) fitText(sub, 64, 40);
		document.querySelectorAll('.opt .txt').forEach((e) => fitText(e, 46, 30));
		return SCENE.duration;
	});
};
window.draw = (t) => SCENE.draw(t);

/** K — fast-cut footage (ffmpeg, underneath) + voice-over + big kinetic captions, GoodPush colours, yellow end card. */
window.setupK = function (job) {
	const stage = document.getElementById('stage');
	document.documentElement.style.background = document.body.style.background = 'transparent';
	const { lang } = job;
	const END = 1.7;
	// captions: each spoken line → chunks of 1–3 words, timed by length inside the line
	const caps = [];
	job.lines.forEach((ln) => {
		const ws = ln.text.split(/\s+/).filter(Boolean);
		const groups = []; let cur = [];
		ws.forEach((w) => { cur.push(w); const len = cur.join(' ').replace(/\*/g, '').length; if (cur.length >= 3 || len >= 12 || /[.,!?…:;]$/.test(w)) { groups.push(cur.join(' ')); cur = []; } });
		if (cur.length) groups.push(cur.join(' '));
		const total = groups.reduce((a, g) => a + g.replace(/\*/g, '').length + 2, 0);
		let t = ln.start;
		groups.forEach((g) => { const d = ((ln.end - ln.start) * (g.replace(/\*/g, '').length + 2)) / total; caps.push({ g, a: t, b: t + d }); t += d; });
	});
	// a *word* (or a word inside *…*) gets the yellow box; keep the stars balanced per chunk
	let open = false;
	const html = (g) => g.split(/\s+/).map((w) => {
		const starts = w.startsWith('*'); const ends = /\*[.,!?…:;]*$/.test(w);
		if (starts) open = true; const hl = open; if (ends) open = false;
		const clean = esc(w.replace(/\*/g, ''));
		return hl ? `<span class="hl">${clean}</span>` : clean;
	}).join(' ');
	caps.forEach((c) => (c.h = html(c.g)));
	const last = job.lines[job.lines.length - 1].end;
	const D = last + 0.5 + END;
	stage.innerHTML = `
		<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 65%,rgba(0,0,0,.35))"></div>
		<div id="tag" class="abs pill" style="left:70px;top:150px;background:rgba(20,20,20,.55);color:#fff;padding:12px 26px 12px 14px;font-size:28px;backdrop-filter:blur(6px)"><span style="width:44px;height:44px;display:inline-block">${smiley('smile', 'sun')}</span>goodpush</div>
		<div id="cap" class="abs display" style="left:60px;right:60px;top:760px;height:420px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:118px;line-height:1.02;text-transform:uppercase;--hl:${STICKER.sun};text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(0,0,0,.45)"><div id="capin"></div></div>
		<div id="endc" class="abs" style="inset:0;background:${STICKER.sun};opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px">
			<div style="width:300px;height:300px">${smiley('wink', 'ink')}</div>
			<div class="display" style="font-size:110px;color:#141414">GOODPUSH</div>
			<div class="pill" style="background:#141414;color:#FBF8F1;font-size:40px">${T.bio[lang].replace('goodpush · ', '')} · ${T.free[lang]}</div>
		</div>`;
	document.querySelectorAll('#cap .hl').forEach((h) => (h.style.textShadow = 'none'));
	let shown = -1;
	SCENE = { duration: D, draw(t) {
		const i = caps.findIndex((c) => t >= c.a && t < c.b + 0.12);
		const cap = document.getElementById('capin');
		if (i !== shown) { cap.innerHTML = i >= 0 ? caps[i].h : ''; cap.querySelectorAll('.hl').forEach((h) => (h.style.textShadow = 'none')); cap.style.transform = 'none'; fitText(document.getElementById('cap'), 118, 60); shown = i; }
		if (i >= 0) { const p = backOut(prog(t, caps[i].a, caps[i].a + 0.16), 2.2); cap.style.transform = `scale(${0.78 + 0.22 * p}) rotate(${(i % 2 ? 1 : -1) * (1 - clamp(p)) * 4}deg)`; cap.style.opacity = clamp(p * 2); }
		const pe = easeExpo(prog(t, D - END, D - END + 0.25));
		const e = document.getElementById('endc'); e.style.opacity = pe; e.style.transform = `scale(${1.08 - 0.08 * pe})`;
		document.getElementById('tag').style.opacity = 1 - pe;
	} };
	return document.fonts.ready.then(() => D);
};


/** Carousel slide (1080×1350) for format E. */
window.slide = function (job, idx, height = 1350) {
	document.documentElement.style.height = document.body.style.height = height + 'px';
	const stage = document.getElementById('stage'); stage.style.height = height + 'px';
	const { lang, theme } = job; const color = CAT[theme]; const colors = [STICKER[color], '#FBF8F1', STICKER.pink, STICKER.mint, STICKER.sun, '#141414'];
	const bgc = colors[idx]; const dark = idx === 5 || (idx === 0 && DARK.includes(color)); const fg = dark ? '#FBF8F1' : '#141414';
	let inner;
	if (idx === 0) inner = `<div class="display" style="font-size:96px">${esc(job.hook[lang])}</div><div style="width:200px;height:200px;margin-top:70px">${smiley('wink', dark ? 'cream' : 'ink')}</div>`;
	else if (idx === 5) inner = `<div style="width:180px;height:180px">${smiley('smile', 'sun')}</div><div class="display" style="font-size:84px;margin-top:50px">${T.bio[lang].replace('goodpush · ', '')}</div><div style="font:600 44px Inter;margin-top:30px;opacity:.8">GoodPush · ${T.free[lang]}</div>`;
	else inner = `<div style="font:800 40px Inter;opacity:.5">${idx}/4</div><div id="big" class="display" style="font-size:100px;margin-top:30px;height:800px;display:flex;align-items:center;--hl:${dark ? STICKER.sun : '#FFFFFF'}"><div>${words(job.phrases[idx - 1][lang])}</div></div>`;
	stage.innerHTML = `<div class="abs" style="inset:0;background:${bgc};color:${fg};padding:110px 100px;display:flex;flex-direction:column;justify-content:center">${inner}</div>`;
	return document.fonts.ready.then(() => { const b = document.getElementById('big'); if (b) fitText(b, 100, 56); });
};
</script>
</body>
</html>
