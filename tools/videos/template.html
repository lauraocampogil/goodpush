<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
	@font-face { font-family: 'Unbounded'; src: url('../../node_modules/@fontsource-variable/unbounded/files/unbounded-latin-wght-normal.woff2') format('woff2'); font-weight: 200 900; }
	@font-face { font-family: 'Unbounded'; src: url('../../node_modules/@fontsource-variable/unbounded/files/unbounded-latin-ext-wght-normal.woff2') format('woff2'); font-weight: 200 900; unicode-range: U+0100-024F, U+1E00-1EFF; }
	@font-face { font-family: 'Anton'; src: url('../../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
	@font-face { font-family: 'Anton'; src: url('../../node_modules/@fontsource/anton/files/anton-latin-ext-400-normal.woff2') format('woff2'); font-weight: 400; unicode-range: U+0100-024F, U+1E00-1EFF; }
	@font-face { font-family: 'Inter'; src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
	@font-face { font-family: 'Inter'; src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-ext-wght-normal.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0100-024F, U+1E00-1EFF; }
	@font-face { font-family: 'Bricolage'; src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wdth-normal.woff2') format('woff2'); font-weight: 200 800; font-stretch: 75% 100%; }
	@font-face { font-family: 'Bricolage'; src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-ext-wdth-normal.woff2') format('woff2'); font-weight: 200 800; font-stretch: 75% 100%; unicode-range: U+0100-024F, U+1E00-1EFF; }
	.brico { font-family: 'Bricolage', 'Inter', sans-serif; font-weight: 800; font-stretch: 82%; letter-spacing: -0.035em; line-height: 0.95; }
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 1080px; height: 1920px; overflow: hidden; background: #D5FF00; }
	#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', sans-serif; color: #0D0D0E; }
	.abs { position: absolute; }
	.display { font-family: 'Bricolage', 'Inter', sans-serif; font-weight: 800; font-stretch: 82%; letter-spacing: -0.035em; line-height: 0.95; }
	.hl { background: var(--hl, #fff); color: #0D0D0E; border-radius: 14px; padding: 0 12px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
	.word { display: inline-block; white-space: pre; }
	.pill { display: inline-flex; align-items: center; gap: 18px; border-radius: 999px; padding: 22px 36px; font: 700 34px 'Inter'; }
	.card { border-radius: 56px; }
	.smiley { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* GoodPush video templates. Deterministic: draw(t) sets every style from the time t (seconds),
   so each frame is exact and the same every render. Safe zones: nothing important in the
   bottom 420 px or the right 170 px (TikTok / Reels buttons). */
const STICKER = { orange: '#F42902', yellow: '#FFB81C', green: '#2F7D4A', mint: '#9FDBBE', pink: '#F7A6C9', purple: '#6C4DA6', cream: '#FDFDFF', sun: '#D5FF00', ink: '#0D0D0E' };
const CAT = { discipline: 'orange', calm: 'purple', sport: 'green', study: 'yellow', build: 'mint', faith: 'cream', selflove: 'pink' };
const DARK = ['orange', 'green', 'purple'];
const T = {
	now: { en: 'now', es: 'ahora', fr: 'maintenant' },
	bio: { en: 'goodpush · link in bio', es: 'goodpush · link en la bio', fr: 'goodpush · lien en bio' },
	free: { en: '14 days free', es: '14 días gratis', fr: '14 jours gratuits' },
	day: { en: 'Day', es: 'Día', fr: 'Jour' },
	ask: { en: 'Comment your number 👇', es: 'Comenta tu número 👇', fr: 'Commente ton numéro 👇' },
	streak: { en: 'day streak', es: 'días seguidos', fr: 'jours d’affilée' },
	theme: {
		discipline: { en: 'Discipline', es: 'Disciplina', fr: 'Discipline' }, study: { en: 'Study', es: 'Estudios', fr: 'Études' },
		calm: { en: 'Calm', es: 'Calma', fr: 'Calme' }, sport: { en: 'Sport', es: 'Deporte', fr: 'Sport' },
		build: { en: 'Build', es: 'Emprender', fr: 'Entreprendre' }, selflove: { en: 'Self-love', es: 'Amor propio', fr: 'Amour de soi' },
		faith: { en: 'Faith', es: 'Fe', fr: 'Foi' }
	},
	weekday: { en: ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], es: ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'], fr: ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'] },
	month: { en: ['January','February','March','April','May','June','July','August','September','October','November','December'], es: ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'], fr: ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'] }
};

function smiley(mood = 'smile', color = 'yellow') {
	const bg = STICKER[color] ?? color; const line = bg === STICKER.ink ? STICKER.cream : STICKER.ink;
	const eyes = mood === 'wink'
		? `<rect x="38" y="35" width="7.5" height="18" rx="3.75" fill="${line}"/><path d="M55 45.5h9" stroke="${line}" stroke-width="7" stroke-linecap="round"/>`
		: mood === 'calm'
			? `<path d="M36.5 45c2.4-3.4 7.6-3.4 10 0M53.5 45c2.4-3.4 7.6-3.4 10 0" fill="none" stroke="${line}" stroke-width="5.5" stroke-linecap="round"/>`
			: `<rect x="38" y="35" width="7.5" height="18" rx="3.75" fill="${line}"/><rect x="54.5" y="35" width="7.5" height="18" rx="3.75" fill="${line}"/>`;
	return `<svg class="smiley" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="${bg}"/><circle cx="50" cy="50" r="33" fill="none" stroke="${line}" stroke-width="7"/>${eyes}<path d="M33 57.5c3.6 9.4 9.8 13.8 17 13.8s13.4-4.4 17-13.8" fill="none" stroke="${line}" stroke-width="7" stroke-linecap="round"/><path d="M29.5 41.5h4.5M29 49.5h3.5" stroke="${line}" stroke-width="3" stroke-linecap="round"/></svg>`;
}

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const backOut = (x, s = 1.7) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const plain = (s) => s.replace(/\*/g, '');
/** Phrase → word spans; the *starred* part gets the highlighter. */
function words(text) {
	const out = [];
	// punctuation right after the highlight stays on the same line as it
	text.replace(/\*([^*]+)\*([.,!?…:;]+)/g, '*$1$2*').split(/(\*[^*]+\*)/g).filter(Boolean).forEach((part) => {
		const hl = part.startsWith('*');
		const clean = hl ? part.slice(1, -1) : part;
		const ws = clean.split(/(\s+)/).filter((w) => w.length);
		const span = (w) => (/^\s+$/.test(w) ? ' ' : `<span class="word">${esc(w)}</span>`);
		if (hl) out.push(`<span class="hl">${ws.map(span).join('')}</span>`);
		else ws.forEach((w) => out.push(span(w)));
	});
	return out.join('');
}
/** Reveal words one by one between t0 and t1 (slide up + fade). */
function revealWords(root, t, t0, t1) {
	const ws = root.querySelectorAll('.word');
	const step = (t1 - t0) / Math.max(1, ws.length);
	ws.forEach((w, i) => {
		const p = easeExpo(prog(t, t0 + i * step, t0 + i * step + 0.45));
		w.style.opacity = p; w.style.transform = `translateY(${(1 - p) * 60}px)`;
	});
	root.querySelectorAll('.hl').forEach((h) => {
		const first = h.querySelector('.word'); h.style.opacity = first ? first.style.opacity : 1;
	});
}
function fitText(el, max, min = 40) {
	let s = max; el.style.fontSize = s + 'px';
	while (s > min && (el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2)) { s -= 4; el.style.fontSize = s + 'px'; }
}

// ---------- scenes ----------
let SCENE = null;
window.setup = function (job) {
	const stage = document.getElementById('stage');
	const { format, lang, theme } = job;
	const color = CAT[theme]; const bg = STICKER[color]; const dark = DARK.includes(color);
	const fg = dark ? '#FDFDFF' : '#0D0D0E';
	const hlColor = dark ? STICKER.sun : '#FFFFFF';
	const ph = job.phrases.map((p) => p[lang]);
	const end = `<div id="end" class="abs pill" style="left:80px; top:1380px; background:#0D0D0E; color:#FDFDFF; opacity:0">
		<span style="width:56px;height:56px;display:inline-block">${smiley('smile', 'sun')}</span>${T.bio[lang]} · ${T.free[lang]}</div>`;
	const d = new Date(job.date + 'T12:00:00');
	const dateLine = `${T.weekday[lang][d.getDay()]} ${d.getDate()} ${T.month[lang][d.getMonth()]}`;
	document.body.style.background = bg;

	if (format === 'A' || format === 'F') {
		const isF = format === 'F';
		const title = isF ? `🔥 ${job.streak} ${T.streak[lang]}` : T.theme[theme][lang];
		stage.innerHTML = `
			<div id="lock" class="abs" style="inset:0; background:#D5FF00">
				<div class="abs" style="left:0;right:0;top:250px;text-align:center;font:600 40px Inter;opacity:.7">${dateLine}</div>
				<div class="abs display" style="left:0;right:0;top:300px;text-align:center;font-size:230px;font-weight:600">${isF ? '07:30' : '08:00'}</div>
				${[['orange', 120, 1280, 240, -12, 'wink'], ['pink', 700, 1180, 200, 14, 'smile'], ['purple', 380, 1500, 170, 6, 'calm']].map(([c, x, y, s, r, m], k) => `<div class="abs float" data-k="${k}" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;transform:rotate(${r}deg)">${smiley(m, c)}</div>`).join('')}
			</div>
			<div id="notif" class="abs card" style="left:60px;width:960px;top:640px;background:rgba(255,255,255,.92);padding:40px 44px;box-shadow:0 30px 60px rgba(0,0,0,.18)">
				<div style="display:flex;align-items:center;gap:22px;font:600 32px Inter;opacity:.6"><span style="width:58px;height:58px;display:inline-block">${smiley('smile', 'ink')}</span>GOODPUSH<span style="margin-left:auto">${T.now[lang]}</span></div>
				<div style="font:800 44px Inter;margin-top:22px">${esc(title)}</div>
				<div style="font:500 42px/1.3 Inter;margin-top:8px">${esc(plain(ph[0]))}</div>
			</div>
			<div id="full" class="abs" style="inset:0;background:${bg};color:${fg};--hl:${hlColor};opacity:0">
				<div class="abs" style="left:80px;top:230px;font:700 36px Inter;letter-spacing:.12em;text-transform:uppercase;opacity:.75">${esc(title)}</div>
				<div id="big" class="abs display" style="left:80px;right:170px;top:330px;height:960px;display:flex;align-items:center"><div>${words(ph[0])}</div></div>
				<div class="abs" style="right:190px;top:1140px;width:220px;height:220px">${smiley('wink', dark ? 'cream' : 'ink')}</div>
			</div>${end}`;
		fitText(document.getElementById('big'), 120, 64);
		SCENE = { duration: 8, draw(t) {
			const n = document.getElementById('notif');
			const pIn = backOut(prog(t, 0.6, 1.3));
			n.style.transform = `translateY(${(1 - pIn) * -900}px) scale(${0.96 + 0.04 * pIn})`;
			const pOut = easeOut(prog(t, 2.8, 3.4));
			n.style.opacity = 1 - pOut;
			n.style.transform += ` scale(${1 + pOut * 0.25})`;
			document.getElementById('full').style.opacity = pOut;
			document.querySelectorAll('.float').forEach((f) => { const k = +f.dataset.k; f.style.marginTop = Math.sin(t * 1.6 + k * 2) * 18 + 'px'; });
			revealWords(document.getElementById('big'), t, 3.3, 4.6);
			document.getElementById('end').style.opacity = easeOut(prog(t, 5.6, 6.1));
		} };
	} else if (format === 'B') {
		const cardBg = ['#FFFFFF', STICKER.pink, STICKER.mint];
		stage.innerHTML = `
			<div class="abs" style="inset:0;background:${bg}"></div>
			<div id="hook" class="abs display" style="left:80px;right:170px;top:200px;font-size:76px;color:${fg}">${esc(job.hook[lang])}</div>
			${ph.map((p, i) => `<div class="abs card opt" style="left:80px;right:170px;top:${560 + i * 300}px;height:260px;background:${cardBg[i]};display:flex;align-items:center;gap:34px;padding:0 44px;box-shadow:0 18px 0 #0D0D0E">
				<div class="display" style="font-size:110px;width:90px">${i + 1}</div><div class="txt" style="font:700 44px/1.2 Inter;height:200px;flex:1;display:flex;align-items:center">${esc(plain(p))}</div></div>`).join('')}
			<div id="ask" class="abs pill" style="left:80px;top:1500px;background:#0D0D0E;color:#FDFDFF;opacity:0">${T.ask[lang]}</div>`;
		document.querySelectorAll('.opt .txt').forEach((e) => fitText(e, 46, 30));
		SCENE = { duration: 9, draw(t) {
			const h = document.getElementById('hook'); const ph0 = easeExpo(prog(t, 0.1, 0.8));
			h.style.opacity = ph0; h.style.transform = `translateY(${(1 - ph0) * 40}px)`;
			document.querySelectorAll('.opt').forEach((o, i) => { const p = backOut(prog(t, 1.0 + i * 1.5, 1.6 + i * 1.5)); o.style.opacity = clamp(p * 3); o.style.transform = `scale(${0.6 + 0.4 * p}) rotate(${(1 - clamp(p)) * (i % 2 ? 6 : -6)}deg)`; });
			const pa = easeOut(prog(t, 5.8, 6.3)); const a = document.getElementById('ask'); a.style.opacity = pa; a.style.transform = `translateY(${(1 - pa) * 30}px)`;
		} };
	} else if (format === 'R') { // R — "cine": real footage underneath (ffmpeg), letterbox + subtitle, no branding until the very end
		document.documentElement.style.background = document.body.style.background = 'transparent';
		const sub = esc(ph[0]).replace(/\*([^*]+)\*/g, '<span style="color:#D5FF00">$1</span>');
		stage.innerHTML = `
			<div class="abs" style="inset:0;background:radial-gradient(120% 80% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)"></div>
			<div class="abs" style="left:0;right:0;top:0;height:250px;background:#0D0D0E"></div>
			<div class="abs" style="left:0;right:0;bottom:0;height:250px;background:#0D0D0E"></div>
			<div id="hook" class="abs" style="left:70px;right:70px;top:150px;font:600 38px/1.2 Inter;color:rgba(255,255,255,.92);text-align:center;letter-spacing:.01em">${esc(job.hook[lang]).toLowerCase()}</div>
			<div id="sub" class="abs" style="left:110px;right:110px;top:1180px;height:380px;display:flex;align-items:center;justify-content:center;text-align:center;font:600 60px/1.28 Inter;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.9),0 0 24px rgba(0,0,0,.6)"><div>${sub}</div></div>
			<div id="mark" class="abs" style="right:70px;bottom:95px;display:flex;align-items:center;gap:14px;font:700 30px Inter;color:rgba(255,255,255,.85);opacity:0"><span style="width:40px;height:40px;display:inline-block">${smiley('smile', 'sun')}</span>goodpush</div>`;
		fitText(document.getElementById('sub'), 64, 40);
		SCENE = { duration: 8, draw(t) {
			const h = document.getElementById('hook'); h.style.opacity = easeOut(prog(t, 0.2, 0.9));
			const s2 = document.getElementById('sub'); const ps = easeOut(prog(t, 1.2, 2.0)); s2.style.opacity = ps; s2.style.transform = `translateY(${(1 - ps) * 14}px)`;
			document.getElementById('mark').style.opacity = easeOut(prog(t, 5.6, 6.2));
		} };
	} else { // D — phrase on color + floating stickers
		stage.innerHTML = `
			<div class="abs" style="inset:0;background:${bg};color:${fg};--hl:${hlColor}">
				${[['sun', 760, 230, 210, 10, 'wink'], ['cream', 90, 1200, 170, -14, 'smile'], ['pink', 620, 1250, 140, 8, 'calm']].map(([c, x, y, s, r, m], k) => `<div class="abs float" data-k="${k}" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;transform:rotate(${r}deg)">${smiley(m, c)}</div>`).join('')}
				<div class="abs" style="left:80px;top:260px;font:700 34px Inter;letter-spacing:.12em;text-transform:uppercase;opacity:.75">${esc(job.hook[lang])}</div>
				<div id="big" class="abs display" style="left:80px;right:170px;top:420px;height:760px;display:flex;align-items:center"><div>${words(ph[0])}</div></div>
			</div>${end.replace('opacity:0', 'opacity:0;background:#FDFDFF;color:#0D0D0E')}`;
		fitText(document.getElementById('big'), 128, 64);
		SCENE = { duration: 7, draw(t) {
			document.querySelectorAll('.float').forEach((f) => { const k = +f.dataset.k; f.style.marginTop = Math.sin(t * 1.4 + k * 2.1) * 22 + 'px'; f.style.marginLeft = Math.cos(t * 1.1 + k) * 10 + 'px'; });
			revealWords(document.getElementById('big'), t, 0.4, 2.2);
			document.getElementById('end').style.opacity = easeOut(prog(t, 4.6, 5.1));
		} };
	}
	return document.fonts.ready.then(() => { // re-fit once the fonts are in
		const big = document.getElementById('big'); if (big) fitText(big, format === 'D' ? 128 : 120, 64);
		const sub = document.getElementById('sub'); if (sub) fitText(sub, 64, 40);
		document.querySelectorAll('.opt .txt').forEach((e) => fitText(e, 46, 30));
		return SCENE.duration;
	});
};
window.draw = (t) => SCENE.draw(t);

/** K — fast-cut footage (ffmpeg, underneath) + voice-over + big kinetic captions, GoodPush colours, yellow end card. */
window.setupK = function (job) {
	const stage = document.getElementById('stage');
	document.documentElement.style.background = document.body.style.background = 'transparent';
	const { lang } = job;
	const END = 1.7;
	// captions: each spoken line → chunks of 1–3 words, timed by length inside the line
	const caps = [];
	job.lines.forEach((ln) => {
		const ws = ln.text.split(/\s+/).filter(Boolean);
		const groups = []; let cur = [];
		ws.forEach((w) => { cur.push(w); const len = cur.join(' ').replace(/\*/g, '').length; if (cur.length >= 3 || len >= 12 || /[.,!?…:;]$/.test(w)) { groups.push(cur.join(' ')); cur = []; } });
		if (cur.length) groups.push(cur.join(' '));
		const total = groups.reduce((a, g) => a + g.replace(/\*/g, '').length + 2, 0);
		let t = ln.start;
		groups.forEach((g) => { const d = ((ln.end - ln.start) * (g.replace(/\*/g, '').length + 2)) / total; caps.push({ g, a: t, b: t + d }); t += d; });
	});
	// a *word* (or a word inside *…*) gets the yellow box; keep the stars balanced per chunk
	let open = false;
	const html = (g) => g.split(/\s+/).map((w) => {
		const starts = w.startsWith('*'); const ends = /\*[.,!?…:;]*$/.test(w);
		if (starts) open = true; const hl = open; if (ends) open = false;
		const clean = esc(w.replace(/\*/g, ''));
		return hl ? `<span class="hl">${clean}</span>` : clean;
	}).join(' ');
	caps.forEach((c) => (c.h = html(c.g)));
	const last = job.lines[job.lines.length - 1].end;
	const D = last + 0.5 + END;
	stage.innerHTML = `
		<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 65%,rgba(0,0,0,.35))"></div>
		<div id="tag" class="abs pill" style="left:70px;top:150px;background:rgba(20,20,20,.55);color:#fff;padding:12px 26px 12px 14px;font-size:28px;backdrop-filter:blur(6px)"><span style="width:44px;height:44px;display:inline-block">${smiley('smile', 'sun')}</span>goodpush</div>
		<div id="cap" class="abs display" style="left:60px;right:60px;top:760px;height:420px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:118px;line-height:1.02;text-transform:uppercase;--hl:${STICKER.sun};text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 40px rgba(0,0,0,.45)"><div id="capin"></div></div>
		<div id="endc" class="abs" style="inset:0;background:${STICKER.sun};opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px">
			<div style="width:300px;height:300px">${smiley('wink', 'ink')}</div>
			<div class="display" style="font-size:110px;color:#0D0D0E">GOODPUSH</div>
			<div class="pill" style="background:#0D0D0E;color:#FDFDFF;font-size:40px">${T.bio[lang].replace('goodpush · ', '')} · ${T.free[lang]}</div>
		</div>`;
	document.querySelectorAll('#cap .hl').forEach((h) => (h.style.textShadow = 'none'));
	let shown = -1;
	SCENE = { duration: D, draw(t) {
		const i = caps.findIndex((c) => t >= c.a && t < c.b + 0.12);
		const cap = document.getElementById('capin');
		if (i !== shown) { cap.innerHTML = i >= 0 ? caps[i].h : ''; cap.querySelectorAll('.hl').forEach((h) => (h.style.textShadow = 'none')); cap.style.transform = 'none'; fitText(document.getElementById('cap'), 118, 60); shown = i; }
		if (i >= 0) { const p = backOut(prog(t, caps[i].a, caps[i].a + 0.16), 2.2); cap.style.transform = `scale(${0.78 + 0.22 * p}) rotate(${(i % 2 ? 1 : -1) * (1 - clamp(p)) * 4}deg)`; cap.style.opacity = clamp(p * 2); }
		const pe = easeExpo(prog(t, D - END, D - END + 0.25));
		const e = document.getElementById('endc'); e.style.opacity = pe; e.style.transform = `scale(${1.08 - 0.08 * pe})`;
		document.getElementById('tag').style.opacity = 1 - pe;
	} };
	return document.fonts.ready.then(() => D);
};



/* ---------- quote formats: real quotes, footage in a 16:9 band (y 656–1264) ---------- */
const BAND = { x: 0, y: 656, w: 1080, h: 608 };
/** "*part*" → acid highlight (text colour, no box: subtitles style) */
const subs = (t, color) => esc(t).replace(/\*([^*]+)\*/g, `<span style="color:${color}">$1</span>`);
/** Split a quote into subtitle chunks (≈ 3–6 words), stars kept balanced per chunk. */
function chunks(text) {
	const ws = text.split(/\s+/).filter(Boolean); const out = []; let cur = []; let open = false;
	ws.forEach((w) => {
		cur.push(w); if (w.startsWith('*')) open = true; if (/\*[.,!?…:;’']*$/.test(w)) open = false;
		const len = plain(cur.join(' ')).length;
		if (cur.length >= 6 || len >= 30 || (/[.,!?…:;]$/.test(plain(w)) && cur.length >= 2)) { out.push({ t: cur.join(' '), open }); cur = []; }
	});
	if (cur.length) out.push({ t: cur.join(' '), open });
	// re-balance stars: a chunk that starts inside a highlight gets an opening star, one that ends inside gets a closing one
	let inside = false;
	return out.map((c) => { let t = c.t; if (inside && !t.startsWith('*')) t = '*' + t; const n = (t.match(/\*/g) || []).length; if (n % 2) t = t + '*'; inside = c.open; return t; });
}

/** Format Q — like @mentalclip: black screen, horizontal clip, white subtitles under it, phrase by phrase.
    Silent by default (the sound is picked in TikTok when publishing the draft). job.quote = { text, who }, job.lines optional (voice timings) */
window.setupQ = function (job) {
	const stage = document.getElementById('stage');
	document.documentElement.style.background = document.body.style.background = 'transparent';
	const { quote } = job; const Y = 560, H = 608;
	const caps = [];
	if (job.lines?.length) {
		job.lines.forEach((ln) => { const cs = chunks(ln.text); const total = cs.reduce((a, c) => a + plain(c).length + 3, 0); let t = ln.start; cs.forEach((c) => { const d = ((ln.end - ln.start) * (plain(c).length + 3)) / total; caps.push({ h: subs(c, '#fff'), a: t, b: t + d }); t += d; }); });
	} else {
		let t = 0.6; chunks(quote.text).forEach((c) => { const d = 0.9 + plain(c).split(/\s+/).length * 0.32; caps.push({ h: subs(c, '#fff'), a: t, b: t + d }); t += d; });
	}
	const last = caps[caps.length - 1].b; const D = last + 1.8;
	stage.innerHTML = `
		<div class="abs" style="left:0;right:0;top:0;height:${Y}px;background:#0D0D0E"></div>
		<div class="abs" style="left:0;right:0;top:${Y + H}px;bottom:0;background:#0D0D0E"></div>
		<div class="abs" style="left:0;right:0;top:${Y - 110}px;display:flex;justify-content:center;align-items:center;gap:12px;color:#FDFDFF;font-family:Bricolage,Inter;font-weight:800;font-stretch:82%;font-size:32px;text-transform:uppercase"><span style="width:42px;height:42px;display:inline-block">${smiley('smile', 'sun')}</span>GoodPush</div>
		<div id="sub" class="abs display" style="left:70px;right:70px;top:${Y + H + 60}px;height:260px;display:flex;align-items:flex-start;justify-content:center;text-align:center;color:#fff;font-size:68px;line-height:1.08"><div id="subin"></div></div>`;
	let shown = -1;
	SCENE = { duration: D, draw(t) {
		const i = caps.findIndex((c) => t >= c.a && t < c.b);
		const sub = document.getElementById('subin');
		if (i !== shown) { sub.innerHTML = i >= 0 ? caps[i].h : ''; fitText(document.getElementById('sub'), 68, 44); shown = i; }
		if (i >= 0) sub.style.opacity = easeOut(prog(t, caps[i].a, caps[i].a + 0.12));
	} };
	return document.fonts.ready.then(() => D);
};

/** Format S — satisfying footage full screen, GoodPush look (same family as K): the short quote, acid highlight, author, logo. Silent. */
window.setupS = function (job) {
	const stage = document.getElementById('stage');
	document.documentElement.style.background = document.body.style.background = 'transparent';
	const { quote } = job;
	const n = plain(quote.text).split(/\s+/).length; const D = Math.max(7, Math.min(12, 3 + n * 0.32));
	const hl = (t) => esc(t).replace(/\*([^*]+)\*/g, '<span style="color:#D5FF00">$1</span>');
	stage.innerHTML = `
		<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(13,13,14,.6),rgba(13,13,14,.35) 35%,rgba(13,13,14,.4) 65%,rgba(13,13,14,.75))"></div>
		<div class="abs" style="left:70px;right:70px;top:120px;height:8px;border-radius:8px;background:rgba(253,253,255,.18)"><div id="bar" style="height:100%;width:0;border-radius:8px;background:#D5FF00"></div></div>
		<div id="q" class="abs" style="left:90px;right:90px;top:620px;height:560px;display:flex;align-items:center;justify-content:center;text-align:center;color:#FDFDFF;font-family:Bricolage,Inter;font-weight:800;font-stretch:75%;letter-spacing:-0.01em;text-transform:uppercase;font-size:92px;line-height:1.02;text-shadow:0 2px 24px rgba(0,0,0,.45)"><div id="qin">${hl(quote.text)}</div></div>
		<div class="abs" style="left:0;right:0;top:1240px;display:flex;justify-content:center;align-items:center;gap:12px;color:#FDFDFF;font-family:Bricolage,Inter;font-weight:800;font-stretch:82%;font-size:34px;text-transform:uppercase"><span style="width:44px;height:44px;display:inline-block">${smiley('smile', 'sun')}</span>GoodPush</div>`;
	fitText(document.getElementById('q'), 92, 52);
	SCENE = { duration: D, draw(t) {
		const p = easeOut(prog(t, 0.15, 0.7)); const q = document.getElementById('qin'); q.style.opacity = p; q.style.transform = `scale(${0.94 + 0.06 * p})`;
		document.getElementById('bar').style.width = job.still ? '0%' : `${clamp(t / D) * 100}%`;
		if (job.still) document.getElementById('bar').parentNode.style.display = 'none';
	} };
	return document.fonts.ready.then(() => D);
};

/** Format K (silent, like @processlaw): full-screen footage, darkened; the message 1–3 words at a time in the middle, GOODPUSH® under it. ≤ 35 s. job.lines = ["…", …] */
window.setupP = function (job) {
	const stage = document.getElementById('stage');
	document.documentElement.style.background = document.body.style.background = 'transparent';
	const text = job.lines.join(' ');
	const ws = plain(text).split(/\s+/).filter(Boolean);
	const groups = []; let cur = [];
	ws.forEach((w) => { cur.push(w); const len = cur.join(' ').length; if (cur.length >= 3 || len >= 14 || /[.,!?…:;]$/.test(w)) { groups.push(cur.join(' ')); cur = []; } });
	if (cur.length) groups.push(cur.join(' '));
	let per = (g) => 0.42 + g.length * 0.035 + (/[.!?…]$/.test(g) ? 0.35 : /[,;:]$/.test(g) ? 0.15 : 0);
	let total = groups.reduce((a, g) => a + per(g), 0);
	const k = Math.min(1, 33 / total); // keep it under ~35 s
	const caps = []; let t = 0.5;
	groups.forEach((g) => { const d = per(g) * k; caps.push({ g, a: t, b: t + d }); t += d; });
	const D = t + 1.2;
	// the last word of each sentence lights up in acid (brand accent)
	caps.forEach((c) => { c.hl = /[.!?…]$/.test(c.g); });
	const lockup = `<span style="display:inline-flex;align-items:center;gap:12px"><span style="width:44px;height:44px;display:inline-block">${smiley('smile', 'sun')}</span><span style="font-family:Bricolage,Inter;font-weight:800;font-stretch:82%;letter-spacing:-0.02em;font-size:34px;text-transform:uppercase">GoodPush</span></span>`;
	const solid = job.solid ? `
		<div class="abs" style="inset:0;background:#0D0D0E"></div>
		<div id="bgA" class="abs" style="left:-260px;top:120px;width:760px;height:760px;opacity:.07">${smiley('smile', 'sun')}</div>
		<div id="bgB" class="abs" style="right:-300px;bottom:180px;width:820px;height:820px;opacity:.06">${smiley('wink', 'orange')}</div>
		<div class="abs" style="left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(213,255,0,.10),rgba(213,255,0,0) 60%)"></div>` : `
		<div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(13,13,14,.55),rgba(13,13,14,.25) 35%,rgba(13,13,14,.3) 65%,rgba(13,13,14,.7))"></div>`;
	stage.innerHTML = `${solid}
		<div class="abs" style="left:70px;right:70px;top:120px;height:8px;border-radius:8px;background:rgba(253,253,255,.18)"><div id="bar" style="height:100%;width:0;border-radius:8px;background:#D5FF00"></div></div>
		<div id="cap" class="abs" style="left:90px;right:90px;top:800px;height:260px;display:flex;align-items:center;justify-content:center;text-align:center;color:#FDFDFF;font-family:Bricolage,Inter;font-weight:800;font-stretch:75%;letter-spacing:-0.01em;text-transform:uppercase;font-size:104px;line-height:1;text-shadow:0 2px 24px rgba(0,0,0,.45)"><div id="capin"></div></div>
		<div class="abs" style="left:0;right:0;top:1150px;display:flex;justify-content:center;color:#FDFDFF">${lockup}</div>`;
	let shown = -1;
	SCENE = { duration: D, draw(t) {
		let i = caps.findIndex((c) => t >= c.a && t < c.b); if (i < 0 && t >= caps[caps.length - 1].a) i = caps.length - 1;
		const cap = document.getElementById('capin');
		if (i !== shown) {
			if (i >= 0) { const ws = caps[i].g.split(' '); const last = ws.pop(); cap.innerHTML = caps[i].hl ? `${esc(ws.join(' '))} <span style="color:#D5FF00">${esc(last)}</span>` : esc(caps[i].g); } else cap.innerHTML = '';
			fitText(document.getElementById('cap'), 104, 56); shown = i;
		}
		if (i >= 0) { const p = easeOut(prog(t, caps[i].a, caps[i].a + 0.1)); cap.style.opacity = p; cap.style.transform = `scale(${0.94 + 0.06 * p})`; }
		document.getElementById('bar').style.width = job.still ? '0%' : `${clamp(t / D) * 100}%`;
		if (job.still) document.getElementById('bar').parentNode.style.display = 'none';
		const A = document.getElementById('bgA'), B = document.getElementById('bgB');
		if (A) { A.style.transform = `rotate(${t * 6}deg)`; B.style.transform = `rotate(${-t * 5}deg)`; }
	} };
	return document.fonts.ready.then(() => D);
};

/** GoodPush voice format (K, S, Q): no footage — the logo, brand colours that change with every sentence,
    the message 1–3 words at a time in sync with the AI voice. job.lines = [{ text, start, end }] (TTS timings). */
const PALETTE = [
	{ bg: '#0D0D0E', fg: '#FDFDFF', acc: '#D5FF00', smiley: 'sun' },
	{ bg: '#D5FF00', fg: '#0D0D0E', acc: '#F42902', smiley: 'ink' },
	{ bg: '#F42902', fg: '#FDFDFF', acc: '#D5FF00', smiley: 'sun' },
	{ bg: '#FDFDFF', fg: '#0D0D0E', acc: '#F42902', smiley: 'sun' }
];
window.setupV = function (job) {
	const stage = document.getElementById('stage');
	const off = Math.abs([...(job.seed || 'gp')].reduce((h, c) => h * 31 + c.charCodeAt(0), 7)) % PALETTE.length;
	const caps = [];
	job.lines.forEach((ln, li) => {
		const ws = plain(ln.text).split(/\s+/).filter(Boolean); const groups = []; let cur = [];
		ws.forEach((w) => { cur.push(w); if (cur.length >= 3 || cur.join(' ').length >= 14 || /[.,!?…:;]$/.test(w)) { groups.push(cur.join(' ')); cur = []; } });
		if (cur.length) groups.push(cur.join(' '));
		const total = groups.reduce((a, g) => a + g.length + 2, 0); let t = ln.start;
		groups.forEach((g, gi) => { const d = ((ln.end - ln.start) * (g.length + 2)) / total; caps.push({ g, a: t, b: t + d, li, last: gi === groups.length - 1 }); t += d; });
	});
	const D = job.lines[job.lines.length - 1].end + 2.4;
	stage.innerHTML = `
		<div id="bg" class="abs" style="inset:0"></div>
		<div id="sA" class="abs" style="left:-280px;top:90px;width:780px;height:780px;opacity:.10"></div>
		<div id="sB" class="abs" style="right:-320px;bottom:150px;width:860px;height:860px;opacity:.08"></div>
		<div class="abs" style="left:70px;right:70px;top:120px;height:8px;border-radius:8px;background:rgba(127,127,127,.25)"><div id="bar" style="height:100%;width:0;border-radius:8px"></div></div>
		<div id="cap" class="abs" style="left:90px;right:90px;top:790px;height:280px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Bricolage,Inter;font-weight:800;font-stretch:75%;letter-spacing:-0.01em;text-transform:uppercase;font-size:110px;line-height:1"><div id="capin"></div></div>
		<div id="logo" class="abs" style="left:0;right:0;top:1160px;display:flex;justify-content:center;align-items:center;gap:14px;font-family:Bricolage,Inter;font-weight:800;font-stretch:82%;letter-spacing:-0.02em;font-size:38px;text-transform:uppercase"><span id="logoS" style="width:52px;height:52px;display:inline-block"></span>GoodPush</div>`;
	let shownCap = -1, shownCol = -1;
	const paint = (k) => {
		const c = PALETTE[(off + k) % PALETTE.length];
		document.getElementById('bg').style.background = c.bg;
		document.getElementById('cap').style.color = c.fg;
		document.getElementById('logo').style.color = c.fg;
		document.getElementById('bar').style.background = c.acc;
		document.getElementById('logoS').innerHTML = smiley('smile', c.smiley === 'ink' ? 'ink' : c.bg === '#D5FF00' ? 'ink' : 'sun');
		document.getElementById('sA').innerHTML = smiley('smile', c.bg === '#0D0D0E' ? 'sun' : 'ink');
		document.getElementById('sB').innerHTML = smiley('wink', c.bg === '#0D0D0E' ? 'orange' : 'ink');
		return c;
	};
	let col = paint(0);
	SCENE = { duration: D, draw(t) {
		// the chunk being said (or the last one said, during the breath between sentences)
		let i = 0; for (let n = 0; n < caps.length; n++) if (caps[n].a <= t) i = n;
		const li = caps[i].li;
		if (li !== shownCol) { col = paint(li); shownCol = li; }
		const cap = document.getElementById('capin');
		if (i !== shownCap) {
			const ws = caps[i].g.split(' '); const lastW = ws.pop();
			if (job.full) { // one phrase that builds up and stays (format J)
				const prev = caps.slice(0, i).map((c) => esc(c.g)).join(' ');
				cap.innerHTML = `${prev} ${caps[i].last ? `${esc(ws.join(' '))} <span style="color:${col.acc}">${esc(lastW)}</span>` : esc(caps[i].g)}`;
			} else cap.innerHTML = caps[i].last ? `${esc(ws.join(' '))} <span style="color:${col.acc}">${esc(lastW)}</span>` : esc(caps[i].g);
			fitText(document.getElementById('cap'), 110, 60); shownCap = i;
		}
		const p = job.still ? 1 : easeOut(prog(t, caps[i].a, caps[i].a + 0.1)); cap.style.opacity = !job.still && t < caps[0].a ? 0 : p; cap.style.transform = `scale(${0.92 + 0.08 * p})`;
		document.getElementById('bar').style.width = job.still ? '0%' : `${clamp(t / D) * 100}%`;
		if (job.still) document.getElementById('bar').parentNode.style.display = 'none';
		document.getElementById('sA').style.transform = `rotate(${t * 6}deg)`; document.getElementById('sB').style.transform = `rotate(${-t * 5}deg)`;
	} };
	return document.fonts.ready.then(() => D);
};

/** Format M (like a pastel "reminder" card): soft background, the phrase, the GoodPush smiley celebrating, sparkles. No footage. */
function mascot(color = 'sun') {
	return `<div style="width:100%;height:100%">${smiley('smile', color)}</div>`;
}
const sparkle = (x, y, s, col, d) => `<svg class="abs spk" data-d="${d}" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px" viewBox="0 0 100 100"><path d="M50 0 C54 36 64 46 100 50 C64 54 54 64 50 100 C46 64 36 54 0 50 C36 46 46 36 50 0Z" fill="${col}"/></svg>`;
window.setupM = function (job) {
	const stage = document.getElementById('stage');
	const { lang } = job; const phrase = job.phrases[0][lang];
	const PAL = [['#F6FFC8', 'sun'], ['#FFE7DE', 'orange'], ['#FFF6D6', 'sun'], ['#EEF0FF', 'sun']];
	const [bg, col] = PAL[Math.abs([...(job.date + job.slot)].reduce((h, c) => h * 31 + c.charCodeAt(0), 7)) % PAL.length];
	document.documentElement.style.background = document.body.style.background = bg;
	const D = 12;
	stage.style.background = bg;
	stage.innerHTML = `
		${sparkle(120, 260, 120, '#FFFFFF', 0)}${sparkle(840, 760, 90, '#FFFFFF', 0.7)}${sparkle(170, 1120, 70, '#0D0D0E', 1.3)}${sparkle(850, 1260, 130, '#FFFFFF', 0.4)}${sparkle(800, 300, 50, '#0D0D0E', 1.8)}${sparkle(230, 1420, 90, '#FFFFFF', 1.1)}
		<div id="txt" class="abs" style="left:110px;right:110px;top:430px;height:420px;display:flex;align-items:center;justify-content:center;text-align:center;color:#0D0D0E;font-family:Bricolage,Inter;font-weight:700;font-stretch:90%;letter-spacing:-0.015em;font-size:72px;line-height:1.12">${esc(plain(phrase))}</div>
		<div id="mas" class="abs" style="left:390px;top:960px;width:300px;height:300px">${mascot(col)}</div>`;
	fitText(document.getElementById('txt'), 72, 44);
	SCENE = { duration: D, draw(t) {
		document.getElementById('mas').style.transform = `translateY(${Math.sin(t * 2.2) * 14}px) rotate(${Math.sin(t * 1.1) * 3}deg)`;
		document.querySelectorAll('.spk').forEach((e) => { const d = +e.dataset.d; const p = 0.75 + 0.25 * Math.sin((t + d) * 3); e.style.transform = `scale(${p}) rotate(${(t + d) * 20}deg)`; e.style.opacity = 0.6 + 0.4 * p; });
	} };
	return document.fonts.ready.then(() => D);
};

/** Carousel slide (1080×1350) for format E. */
window.slide = function (job, idx, height = 1350) {
	document.documentElement.style.height = document.body.style.height = height + 'px';
	const stage = document.getElementById('stage'); stage.style.height = height + 'px';
	const { lang, theme } = job; const color = CAT[theme]; const colors = [STICKER[color], '#FDFDFF', STICKER.pink, STICKER.mint, STICKER.sun, '#0D0D0E'];
	const bgc = colors[idx]; const dark = idx === 5 || (idx === 0 && DARK.includes(color)); const fg = dark ? '#FDFDFF' : '#0D0D0E';
	let inner;
	if (idx === 0) inner = `<div class="display" style="font-size:96px">${esc(job.hook[lang])}</div><div style="width:200px;height:200px;margin-top:70px">${smiley('wink', dark ? 'cream' : 'ink')}</div>`;
	else if (idx === 5) inner = `<div style="width:180px;height:180px">${smiley('smile', 'sun')}</div><div class="display" style="font-size:84px;margin-top:50px">${T.bio[lang].replace('goodpush · ', '')}</div><div style="font:600 44px Inter;margin-top:30px;opacity:.8">GoodPush · ${T.free[lang]}</div>`;
	else inner = `<div style="font:800 40px Inter;opacity:.5">${idx}/4</div><div id="big" class="display" style="font-size:100px;margin-top:30px;height:800px;display:flex;align-items:center;--hl:${dark ? STICKER.sun : '#FFFFFF'}"><div>${words(job.phrases[idx - 1][lang])}</div></div>`;
	stage.innerHTML = `<div class="abs" style="inset:0;background:${bgc};color:${fg};padding:110px 100px;display:flex;flex-direction:column;justify-content:center">${inner}</div>`;
	return document.fonts.ready.then(() => { const b = document.getElementById('big'); if (b) fitText(b, 100, 56); });
};
