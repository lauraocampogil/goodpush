# Every Saturday: renders next week's 63 posts (EN/ES/FR) and queues them for Instagram + TikTok.
# /api/cron/social (Supabase cron, every 10 min) then publishes each one at its time.
# Secrets (GitHub → Settings → Secrets and variables → Actions): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, PEXELS_API_KEY
name: Social — render + queue next week
on:
  schedule:
    - cron: '17 6 * * 6'
  workflow_dispatch:
    inputs:
      week:
        description: 'Monday to render (YYYY-MM-DD). Empty = next week'
        required: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
      - name: Week
        id: week
        run: |
          if [ -n "${{ inputs.week }}" ]; then echo "monday=${{ inputs.week }}" >> "$GITHUB_OUTPUT"; else
          echo "monday=$(node -e "const d=new Date();d.setUTCDate(d.getUTCDate()+((8-d.getUTCDay())%7||7));console.log(d.toISOString().slice(0,10))")" >> "$GITHUB_OUTPUT"; fi
      - name: Render
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node tools/videos/render.mjs ${{ steps.week.outputs.monday }} 7 --auto
      - name: Queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tools/videos/queue.mjs ${{ steps.week.outputs.monday }}
      - uses: actions/upload-artifact@v4
        with:
          name: videos-${{ steps.week.outputs.monday }}
          path: marketing/videos/${{ steps.week.outputs.monday }}
          retention-days: 14
